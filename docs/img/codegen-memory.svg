<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="One memory read, before and after"><title>One memory read, before and after</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="470" rx="16" fill="#ffffff"/><text x="24" y="34" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">MOVE.w (A0)+,D1 : the code generated for the read</text><rect x="20" y="54" width="470" height="396" rx="14" fill="#fef2f2" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2 0"/><text x="34" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">today: Musashi 3.1 may take an IRQ inside the read</text><rect x="36" y="92" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="117" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">s32i  a5, PPC</text><text x="300" y="110" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">state an IRQ inside the</text><text x="300" y="125" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">handler would push</text><rect x="36" y="140" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="165" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">movi + s32i  IR</text><rect x="36" y="188" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="213" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">movi + s32i  PC</text><rect x="36" y="236" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="261" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">compute + store X N Z V C</text><text x="300" y="254" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">all flags live before</text><text x="300" y="269" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">every access</text><rect x="36" y="284" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="309" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">l32i  A0 ; addi ; s32i  A0</text><text x="300" y="309" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">address + (An)+ update</text><rect x="36" y="332" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="357" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">l32r  handler ; mov a10 ; callx8</text><text x="300" y="350" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">MAME memory tables</text><text x="300" y="365" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">for ROM and RAM too</text><rect x="36" y="380" width="250" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/><text x="48" y="405" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">PC != next ? leave</text><text x="300" y="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">check after the call</text><rect x="510" y="54" width="470" height="396" rx="14" fill="#f0fdf4" fill-opacity="0.55" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="2 0"/><text x="524" y="76" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">after F2 + F3: IRQs between instructions</text><rect x="526" y="92" width="250" height="40" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="538" y="117" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">l32i.n  a4, A0</text><text x="790" y="117" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A0 (or a pinned register, F4)</text><rect x="526" y="140" width="250" height="40" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="538" y="165" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">addi.n ; s32i.n  A0</text><text x="790" y="165" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">(An)+ update</text><rect x="526" y="188" width="250" height="40" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="538" y="213" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">extui  page ; l32i  base</text><text x="790" y="213" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">64 KB page table, shared</text><rect x="526" y="236" width="250" height="40" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="538" y="261" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">beqz  base, cold</text><text x="790" y="261" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">I/O or bank: out of line</text><rect x="526" y="284" width="250" height="40" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="538" y="309" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start" xml:space="preserve">add ; l16ui  a7</text><text x="790" y="309" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">direct read, no call</text><rect x="526" y="340" width="438" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" filter="url(#sh)"/><text x="745.0" y="362.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#1e293b" text-anchor="middle">cold area at the end of the block</text><text x="745.0" y="381.0" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">slow path: callx8 into MAME for I/O and banks</text><text x="745.0" y="398.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#1e293b" text-anchor="middle">flags only where a later instruction reads them</text></svg>
