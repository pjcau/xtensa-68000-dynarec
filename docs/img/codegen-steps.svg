<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 546" width="1000" height="546" role="img" aria-label="Code generation plan steps"><title>Code generation plan steps</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect x="0" y="0" width="1000" height="546" rx="16" fill="#ffffff"/><text x="24" y="34" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="650" fill="#0f172a" text-anchor="start">each step: QEMU fuzz 0 mismatches (Musashi 4.5 + 3.1), MAMEBENCH 7/7 hashes, 68000 ms measured</text><rect x="24" y="56" width="56" height="44" rx="10" fill="#64748b"/><text x="52" y="84" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F0</text><rect x="92" y="56" width="884" height="44" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="108" y="83" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="start">measure</text><text x="400" y="83" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">bytes per instruction by kind, flushes/min, 68000 ms</text><path d="M52,100 L52,113" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="114" width="56" height="44" rx="10" fill="#ea580c"/><text x="52" y="142" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F1</text><rect x="92" y="114" width="884" height="44" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="108" y="141" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#7c2d12" text-anchor="start">16-bit forms</text><text x="400" y="141" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">l32i.n / s32i.n / mov.n / add.n / addi.n / movi.n</text><path d="M52,158 L52,171" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="172" width="56" height="44" rx="10" fill="#d97706"/><text x="52" y="200" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F2</text><rect x="92" y="172" width="884" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="108" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#78350f" text-anchor="start">IRQs between instructions</text><text x="400" y="199" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">interpreter AND dynarec, new reference hashes, webcam</text><path d="M52,216 L52,229" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="230" width="56" height="44" rx="10" fill="#0d9488"/><text x="52" y="258" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F3</text><rect x="92" y="230" width="884" height="44" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/><text x="108" y="257" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">direct ROM / RAM access</text><text x="400" y="257" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">page table shared with the interpreter (9d-1), idle hash kept</text><path d="M52,274 L52,287" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="288" width="56" height="44" rx="10" fill="#2563eb"/><text x="52" y="316" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F4</text><rect x="92" y="288" width="884" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="108" y="315" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="start">pinned registers</text><text x="400" y="315" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">callx12, 4 guest registers in a8-a11</text><path d="M52,332 L52,345" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="346" width="56" height="44" rx="10" fill="#7c3aed"/><text x="52" y="374" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F5</text><rect x="92" y="346" width="884" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/><text x="108" y="373" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="start">lazy flags</text><text x="400" y="373" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">only if flags are still &gt; 15 % of the code after F2</text><path d="M52,390 L52,403" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="24" y="404" width="56" height="44" rx="10" fill="#64748b"/><text x="52" y="432" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">F6</text><rect x="92" y="404" width="884" height="44" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="108" y="431" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="start">code cache in IRAM</text><text x="400" y="431" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">deferred: needs &gt;= 24 KB of internal RAM free</text><rect x="24" y="468" width="952" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6" filter="url(#sh)"/><text x="500.0" y="495.75" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" font-weight="650" fill="#14532d" text-anchor="middle">goal: ~20-25 bytes per 68000 instruction, 68000 under the interpreter&#x27;s 8.71 ms (aim 5-6 ms)</text></svg>
